<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVABALL — actors sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; left: 8px; top: 8px; color: #9fe8ff; font: 12px/1.35 ui-monospace, monospace; white-space: pre;
             pointer-events: none; text-shadow: 0 0 3px #000, 0 0 2px #000; }
      #fx { position: fixed; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
      #fx button { font: 11px ui-monospace, monospace; background: #0b1424cc; color: #bfefff; border: 1px solid #1ec8ff55; padding: 3px 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="c" tabindex="0"></canvas>
    <div id="hud"></div>
    <div id="fx"></div>
    <script type="module" src="./actors-sandbox.ts"></script>
  </body>
</html>
