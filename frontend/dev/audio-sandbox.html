<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVABALL — Audio Sandbox</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #05070d;
        --panel: rgba(18, 26, 44, 0.78);
        --edge: #1ec8ff;
        --edge2: #ff6a1a;
        --text: #d8e6ff;
        --dim: #7f93b8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: radial-gradient(1200px 700px at 70% -10%, #1b1140 0%, var(--bg) 60%); color: var(--text); font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; min-height: 100%; }
      header { padding: 18px 24px 8px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      h1 { margin: 0; font-size: 22px; letter-spacing: 0.2em; color: #fff; text-shadow: 0 0 12px var(--edge); }
      h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--edge); }
      main { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; padding: 12px 24px 24px; }
      section { background: var(--panel); border: 1px solid rgba(30, 200, 255, 0.25); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); }
      section.wide { grid-column: 1 / -1; }
      button { background: rgba(30, 200, 255, 0.08); color: var(--text); border: 1px solid rgba(30, 200, 255, 0.45); border-radius: 6px; padding: 6px 10px; margin: 3px; cursor: pointer; font: inherit; font-size: 12.5px; }
      button:hover { background: rgba(30, 200, 255, 0.2); box-shadow: 0 0 10px rgba(30, 200, 255, 0.35); }
      button.hot { border-color: var(--edge2); background: rgba(255, 106, 26, 0.12); }
      button.big { font-size: 15px; padding: 10px 18px; border-width: 2px; }
      button.on { background: rgba(30, 200, 255, 0.35); color: #fff; }
      label { display: inline-flex; align-items: center; gap: 6px; margin: 4px 10px 4px 0; color: var(--dim); }
      input[type='range'] { width: 150px; }
      pre { white-space: pre; overflow: auto; max-height: 480px; font: 11.5px/1.35 ui-monospace, 'SFMono-Regular', Menlo, monospace; color: #bfe9ff; margin: 0; }
      #status { color: var(--dim); }
      .kv { font: 12px ui-monospace, monospace; color: #9fd6ff; }
      canvas { width: 100%; height: 90px; background: #03050a; border-radius: 6px; display: block; margin-top: 6px; }
    </style>
  </head>
  <body>
    <header>
      <h1>NOVABALL · AUDIO</h1>
      <button id="unlock" class="big hot">🔊 Unlock audio</button>
      <span id="status">locked</span>
    </header>
    <main>
      <section>
        <h2>Mix</h2>
        <label>master <input id="vMaster" type="range" min="0" max="1" step="0.01" value="0.8" /></label><br />
        <label>sfx <input id="vSfx" type="range" min="0" max="1" step="0.01" value="0.9" /></label><br />
        <label>music <input id="vMusic" type="range" min="0" max="1" step="0.01" value="0.55" /></label>
        <canvas id="scope" width="640" height="90"></canvas>
      </section>
      <section>
        <h2>Music</h2>
        <div id="musicBtns"></div>
        <label>intensity <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.4" /> <span id="intensityV">0.40</span></label>
        <div id="stingerBtns"></div>
        <div class="kv" id="musicInfo"></div>
      </section>
      <section>
        <h2>UI sounds (hover me too)</h2>
        <div id="uiBtns"></div>
      </section>
      <section class="wide">
        <h2>Gameplay SFX</h2>
        <div id="sfxBtns"></div>
      </section>
      <section class="wide">
        <h2>Match events</h2>
        <div id="eventBtns"></div>
      </section>
      <section>
        <h2>Drive sim (continuous sounds)</h2>
        <label><input id="drive" type="checkbox" /> run world (W/S throttle, A/D steer, Shift boost, Space jump, C slide)</label><br />
        <label><input id="spectator" type="checkbox" /> spectator (no player car)</label>
        <label><input id="autoEv" type="checkbox" /> auto events</label><br />
        <label><input id="paused" type="checkbox" /> paused</label>
        <label><input id="slowmo" type="checkbox" /> slow-mo 0.25</label>
        <label><input id="replay" type="checkbox" /> replay</label><br />
        <label>surge <input id="surge" type="range" min="0" max="1" step="0.01" value="0" /></label>
        <label>ball charge <select id="charge"><option>0</option><option>1</option><option>2</option><option>3</option></select></label>
        <div class="kv" id="driveInfo"></div>
      </section>
      <section>
        <h2>Verification</h2>
        <button id="offline" class="hot">Run offline render checks</button>
        <button id="bench">Benchmark update()</button>
        <button id="simMatch">Real-sim 3v3 match (offline, 30 s)</button>
        <div class="kv" id="checkStatus"></div>
      </section>
      <section class="wide">
        <h2>Report</h2>
        <pre id="report">—</pre>
      </section>
    </main>
    <script type="module" src="./audio-sandbox.ts"></script>
  </body>
</html>
