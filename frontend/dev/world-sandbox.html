<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVABALL — world sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #hud { position: fixed; left: 8px; top: 8px; font: 12px/1.35 ui-monospace, monospace; color: #9fd4ff; background: rgba(0,0,0,0.45); padding: 6px 8px; border-radius: 4px; white-space: pre; pointer-events: none; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #9fd4ff; font: 16px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="loading">loading…</div>
    <div id="hud" hidden></div>
    <script type="module" src="./world-sandbox.ts"></script>
  </body>
</html>
